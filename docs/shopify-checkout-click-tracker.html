<!--
  "Clicked checkout" tracking for the Lip Studio funnel.

  Goes in the theme's layout/theme.liquid, just before </body>, so it runs on
  every store page (the cart drawer, and its checkout button, exist on all of
  them). Not a Custom Liquid section: those only render on one page.

  The checkout button is a form submit: the page starts navigating the
  instant it is pressed, which cancels any request started at click time.
  So the quiz session id is learned AHEAD of the click (from the quiz's own
  cart-add message, and from /cart.js on load and whenever the cart changes)
  and the click itself only fires one keepalive request, which survives the
  navigation. Carts that didn't come from the quiz produce nothing.

  Together with the webhook-driven events this gives the Analytics funnel:
    checkout_clicked    pressed a checkout button        (this script)
    checkout_initiated  entered contact info, continued  (checkouts/create webhook)
    checkout_completed  paid                             (orders/create webhook)
-->
<script>
(function () {
  var ENDPOINT = "https://ouoyczbtpbhtwbygpigx.supabase.co/rest/v1/quiz_events";
  var KEY = "sb_publishable_7KFC_TRO0FxJYrX6IsEhyg_x721kjJc";
  var QUIZ_ORIGIN = "https://lipstudio.teakbeauty.com";
  var SELECTOR = 'button[name="checkout"], input[name="checkout"], a[href^="/checkout"], [data-checkout-button], .cart__checkout-button, .cart-drawer__checkout, .cart__checkout';
  var sessionId = null;
  var sent = false; // one event per page view

  function refresh() {
    try {
      fetch("/cart.js", { credentials: "same-origin" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (cart) {
          var id = cart && cart.attributes && cart.attributes.quiz_session_id;
          sessionId = id || null;
        })
        .catch(function () {});
    } catch (e) {}
  }

  // Learn the id ahead of time: on load, whenever the theme reports a cart
  // change or opens the drawer, and straight from the quiz's add-to-cart
  // message (same page, so no round trip needed).
  refresh();
  document.addEventListener("cart:updated", refresh);
  document.addEventListener("cartdrawer:opened", refresh);
  window.addEventListener("message", function (event) {
    if (event.origin !== QUIZ_ORIGIN) return;
    if (event.data && event.data.type === "cart-add" && event.data.quizSessionId) {
      sessionId = String(event.data.quizSessionId);
    }
  });

  document.addEventListener("click", function (event) {
    var target = event.target && event.target.closest ? event.target.closest(SELECTOR) : null;
    if (!target || sent || !sessionId) return;
    sent = true;
    var source = target.closest("cart-drawer, #mini-cart, .cart-drawer, .mini-cart") ? "cart_drawer"
      : location.pathname.indexOf("/cart") === 0 ? "cart_page" : "other";
    var body = JSON.stringify({
      session_id: sessionId,
      event_name: "checkout_clicked",
      event_data: { source: source, page: location.pathname }
    });
    try {
      // keepalive: the request completes even though the page is leaving.
      fetch(ENDPOINT, {
        method: "POST",
        keepalive: true,
        headers: { "Content-Type": "application/json", apikey: KEY, Authorization: "Bearer " + KEY, Prefer: "return=minimal" },
        body: body
      }).catch(function () {});
    } catch (e) {}
  }, true);
})();
</script>
